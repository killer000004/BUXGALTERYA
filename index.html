<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imtihon testi (4 ta variantli)</title>
    <style>
        :root { --p: #3498db; --d: #2c3e50; --bg: #f4f7f6; --s: #27ae60; --err: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 850px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative; }
        h1 { text-align: center; color: var(--d); border-bottom: 3px solid var(--p); padding-bottom: 10px; }
        
        #top-bar { position: sticky; top: 10px; z-index: 100; display: flex; gap: 10px; margin-bottom: 20px; }
        .info-card { flex: 1; background: var(--d); color: white; padding: 10px; border-radius: 8px; text-align: center; font-size: 1.1em; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .loading { text-align: center; font-size: 1.2em; padding: 50px; color: var(--p); }
        .subject-header { background: #ecf0f1; color: var(--d); padding: 10px; margin: 30px 0 10px; border-radius: 5px; font-weight: bold; border-left: 5px solid var(--p); text-transform: uppercase; }
        .q-card { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 10px; background: #fff; }
        .options label { display: block; padding: 12px; border: 1px solid #eee; margin-top: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 1em; }
        .options label:hover { background: #f0f4f8; }
        .btn { background: var(--s); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 1.1em; font-weight: bold; margin-top: 20px; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        #result-area { text-align: center; padding: 30px; background: #eef7ff; border-radius: 10px; margin-bottom: 20px; display: none; border: 2px solid var(--p); }
        .score-big { font-size: 2em; color: var(--p); margin: 10px 0; }
        .opt-prefix { font-weight: bold; color: var(--p); margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Imtihon testi</h1>
    
    <div id="top-bar" style="display: none;">
        <div class="info-card">Vaqt: <span id="timer">60:00</span></div>
        <div class="info-card">Tizim: Har bir to'g'ri javob = 2 ball</div>
    </div>
    
    <div id="loader" class="loading">Google Sheets-dan ma'lumotlar tekshirilmoqda...</div>

    <div id="quiz-container" style="display:none;">
        <div id="result-area"></div>
        <div id="questions-area"></div>
        <button class="btn" id="finish-btn" onclick="checkResults()">Testni yakunlash va ballni bilish</button>
    </div>
</div>

<script>
    // BU YERGA YANGI DEPLOY QILINGAN APPS SCRIPT LINKINGIZNI QO'YING
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxAlLLmpLteYCeyTr3IEQxr5HKVq_g8lscgsR3z3yeiAWsw8bIKVG2nEUO0indDb4nx/exec"; 

    let allQuestions = [];
    let timerInterval;
    let timeLeft = 60 * 60; 

    async function loadQuestions() {
        try {
            const response = await fetch(GAS_URL);
            allQuestions = await response.json();
            renderQuiz();
            startTimer();
        } catch (error) {
            document.getElementById('loader').innerHTML = "<b style='color:red'>Xatolik! Ulanishda uzilish bo'ldi.</b>";
        }
    }

    function startTimer() {
        document.getElementById('top-bar').style.display = 'flex';
        timerInterval = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Vaqt tugadi! Testingiz avtomatik tekshiriladi.");
                checkResults();
            }
        }, 1000);
    }

    function renderQuiz() {
        const area = document.getElementById('questions-area');
        const shuffle = (a) => a.sort(() => Math.random() - 0.5);
        
        // 1. Ma'lumotlarni qat'iy standartga keltirish
        let normalizedQuestions = allQuestions.map(q => {
            let savol = q.savol || q["Savol matni"] || q["Savol matni "] || q["SAVOL"] || q["Savol"] || "";
            let javob = q.javob || q["To`gri javob "] || q["To'g'ri javob"] || q["TO'GRI JAVOB"] || q["To‘g‘ri javob"] || "";
            
            // Agarda javoblar obyekt ichida massiv ko'rinishida kelgan bo'lsa bitta massivga yig'amiz
            let rawXato = [];
            Object.keys(q).forEach(k => {
                if (k.toLowerCase().includes('xato') || k.toLowerCase().includes('notog') || k.toLowerCase().includes('variant')) {
                    if (Array.isArray(q[k])) {
                        rawXato.push(...q[k]);
                    } else {
                        rawXato.push(q[k]);
                    }
                }
            });

            // To'g'ri javobga teng bo'lmagan, bo'sh bo'lmagan xato variantlarni tozalash
            let xato = [...new Set(rawXato)]
                        .map(v => v ? v.toString().trim() : "")
                        .filter(v => v !== "" && v !== javob.toString().trim());

            let fanNomi = q["Fan nomi"] || "Boshqa fanlar";
            return { savol, javob, xato, fanNomi };
        }).filter(q => q.savol && q.javob);

        // 2. Fanlar (Bloklar) bo'yicha ajratish
        let poolAudit = normalizedQuestions.filter(q => q.fanNomi.toLowerCase().includes('audit') || q.savol.toLowerCase().includes('audit'));
        let poolTahlil = normalizedQuestions.filter(q => q.fanNomi.toLowerCase().includes('tahlil') || q.fanNomi.toLowerCase().includes('iqtisodiy'));
        let poolHisobot = normalizedQuestions.filter(q => q.fanNomi.toLowerCase().includes('hisobot') || q.fanNomi.toLowerCase().includes('moliyaviy'));

        let selected = [];
        selected.push(...shuffle(poolAudit).slice(0, 17));
        selected.push(...shuffle(poolTahlil).slice(0, 17));
        selected.push(...shuffle(poolHisobot).slice(0, 16));

        // Jami ro'yxatni 50 taga tekshirish va to'ldirish
        if (selected.length < 50) {
            let currentIds = new Set(selected.map(s => s.savol));
            let extra = normalizedQuestions.filter(q => !currentIds.has(q.savol));
            selected.push(...shuffle(extra).slice(0, 50 - selected.length));
        }
        selected = selected.slice(0, 50);

        // Barcha savollardan umumiy xato javoblar zaxirasini yaratamiz (agar variant yetishmay qolsa ishlatish uchun)
        let backupWrongOptions = [];
        normalizedQuestions.forEach(q => backupWrongOptions.push(...q.xato));
        backupWrongOptions = [...new Set(backupWrongOptions)].filter(Boolean);

        // 3. Ekranga variantlarni aralashtirib qat'iy 4 ta qilib chiqarish
        area.innerHTML = selected.map((item, idx) => {
            let currentWrong = [...item.xato];
            
            // QAT'IY NAZORAT: Agar xato javoblar soni 3 tadan kam bo'lsa, zaxiradan to'ldiradi
            while (currentWrong.length < 3) {
                let randomOption = backupWrongOptions[Math.floor(Math.random() * backupWrongOptions.length)];
                if (randomOption !== item.javob && !currentWrong.includes(randomOption)) {
                    currentWrong.push(randomOption);
                }
            }
            // Faqat 3 ta xato variantni kesib olamiz
            currentWrong = currentWrong.slice(0, 3);

            // To'g'ri javob bilan birlashtirib aralashtiramiz (Jami qat'iy 4 ta variant bo'ladi)
            const finalOptions = shuffle([item.javob, ...currentWrong]);
            const prefixes = ["A", "B", "C", "D"];
            
            let blockHeader = "";
            if (idx === 0) blockHeader = "<div class='subject-header'>I. AUDIT FANIDAN TESTLAR</div>";
            if (idx === 17) blockHeader = "<div class='subject-header'>II. IQTISODIY TAHLIL FANIDAN TESTLAR</div>";
            if (idx === 34) blockHeader = "<div class='subject-header'>III. MOLIYAVIY HISOBOT FANIDAN TESTLAR</div>";

            return `
                ${blockHeader}
                <div class="q-card" data-correct="${item.javob}">
                    <strong>${idx + 1}. ${item.savol}</strong>
                    <div class="options">
                        ${finalOptions.map((opt, oIdx) => `
                            <label>
                                <input type="radio" name="q${idx}" value="${opt}"> 
                                <span class="opt-prefix">${prefixes[oIdx]})</span> ${opt}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
        
        document.getElementById('loader').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
    }

    function checkResults() {
        clearInterval(timerInterval);
        document.getElementById('top-bar').style.display = 'none';
        
        let correctCount = 0;
        const cards = document.querySelectorAll('.q-card');
        
        cards.forEach((card, idx) => {
            const correct = card.getAttribute('data-correct');
            const selected = card.querySelector(`input[name="q${idx}"]:checked`);
            const allLabels = card.querySelectorAll('label');
            
            card.querySelectorAll('input').forEach(inp => inp.disabled = true);

            if (selected) {
                if (selected.value === correct) {
                    correctCount++;
                    selected.parentElement.classList.add('correct');
                } else {
                    selected.parentElement.classList.add('wrong');
                    allLabels.forEach(lbl => {
                        if(lbl.innerText.includes(correct)) lbl.style.border = "2px solid green";
                    });
                }
            }
        });

        const totalScore = correctCount * 2; 
        const maxScore = cards.length * 2;

        const resArea = document.getElementById('result-area');
        resArea.style.display = 'block';
        resArea.innerHTML = `
            <h2>Test natijalari</h2>
            <div class="score-big">${totalScore} dan ${maxScore} ball</div>
            <p>To'g'ri javoblar: ${correctCount} tadan ${cards.length} ta</p>
            <p>Bajarilish foizi: ${(correctCount/cards.length*100).toFixed(1)}%</p>
            <button onclick="location.reload()" style="padding:10px 20px; cursor:pointer; margin-top:15px;">Qaytadan topshirish</button>
        `;
        
        document.getElementById('finish-btn').style.display = 'none';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    loadQuestions();
</script>
</body>
</html>
